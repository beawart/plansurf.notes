<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b3f">
<title>Field Notes | Document Repository</title>
<style>
:root{--ink:#18383a;--muted:#718184;--paper:#fbfaf7;--card:#fff;--line:#e4e8e4;--teal:#0e7772;--mint:#dff2ea;--coral:#e87358;--yellow:#f8e6a9;--shadow:0 12px 35px #173b3f12;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px max(18px,calc((100vw - 1180px)/2));background:#fbfaf7ee;backdrop-filter:blur(18px);border-bottom:1px solid #e4e8e480}.brand{display:flex;gap:11px;align-items:center}.brand-mark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:var(--ink);color:#e8f5ef;font-size:20px;box-shadow:4px 4px 0 var(--coral)}.brand h1{font-size:17px;margin:0;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:8px}.icon-btn,.primary,.ghost{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:9px 12px;font-weight:700}.icon-btn{width:40px;height:40px;padding:0;font-size:18px}.primary{background:var(--teal);color:white;border-color:var(--teal);box-shadow:0 4px 10px #0e777233}.ghost:hover,.icon-btn:hover{background:var(--mint)}.shell{max-width:1180px;margin:auto;padding:24px 18px 80px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 26px}.hero h2{font:clamp(30px,6vw,52px)/.98 Georgia,serif;letter-spacing:-2px;margin:0 0 8px}.hero p{margin:0;color:var(--muted);max-width:520px}.hero .primary{white-space:nowrap;padding:13px 17px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.search{position:relative;flex:1;min-width:230px}.search span{position:absolute;left:13px;top:9px;color:var(--muted)}.search input{width:100%;padding:11px 13px 11px 37px;border:1px solid var(--line);border-radius:13px;background:white;outline:none}.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--mint)}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.filter{border:1px solid var(--line);background:white;color:var(--muted);padding:9px 12px;border-radius:99px;white-space:nowrap}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.stats{display:flex;gap:10px;margin-bottom:23px;overflow:auto}.stat{min-width:128px;padding:14px 16px;border-radius:15px;background:var(--mint);border:1px solid #c8e7da}.stat:nth-child(2){background:#fff3d0;border-color:#f3dda1}.stat:nth-child(3){background:#ffe4dc;border-color:#f5c2b5}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.doc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.2s;animation:rise .35s both}.doc:hover{transform:translateY(-3px);box-shadow:0 18px 42px #173b3f18}.doc-cover{height:154px;background:var(--mint);position:relative;display:grid;place-items:center;overflow:hidden}.doc-cover img{width:100%;height:100%;object-fit:cover}.doc-cover .kind{font-size:48px}.doc-cover .badge{position:absolute;left:12px;top:12px;padding:5px 9px;border-radius:8px;background:#ffffffdd;color:var(--ink);font-size:11px;font-weight:800}.doc-body{padding:15px}.doc h3{font-size:16px;line-height:1.2;margin:0 0 5px}.doc .subtitle{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.tag{font-size:10px;padding:4px 7px;border-radius:7px;background:#f1f4f1;color:var(--muted)}.doc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:var(--muted);font-size:11px}.doc-foot button{border:0;background:none;color:var(--teal);font-weight:800;padding:0}.empty{padding:65px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font:25px Georgia,serif;margin-bottom:7px}.empty button{margin-top:16px}.modal-wrap{position:fixed;inset:0;z-index:30;background:#12383a66;display:grid;place-items:end center;padding:10px}.modal{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--paper);border-radius:24px 24px 15px 15px;padding:23px;box-shadow:0 20px 70px #173b3f44;animation:slide .25s}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.modal h2{font:28px Georgia,serif;margin:0}.close{border:0;background:none;font-size:24px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--mint)}.capture{border:1.5px dashed #9bcbb9;background:var(--mint);border-radius:14px;padding:18px;text-align:center;color:var(--teal);margin-bottom:15px}.capture input{display:none}.capture label{display:block;font-weight:800;cursor:pointer}.capture small{display:block;color:var(--muted);margin-top:5px}.preview{max-height:150px;max-width:100%;border-radius:10px;margin-top:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.detail-image{width:100%;max-height:330px;object-fit:contain;border-radius:15px;background:var(--mint);margin-bottom:16px}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.detail-meta div{background:white;border:1px solid var(--line);padding:11px;border-radius:11px}.detail-meta small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.note{white-space:pre-wrap;background:#fff3d0;border-radius:12px;padding:13px;margin-top:14px}.sync-status{padding:11px 13px;border-radius:11px;background:var(--mint);color:var(--teal);font-size:12px;margin-top:12px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.danger{color:#b64532}.hidden{display:none}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes slide{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.modal-wrap{place-items:center}.modal{border-radius:24px}.hero{margin-top:34px}}@media(max-width:580px){.topbar{padding:12px 14px}.brand small{display:none}.hero{align-items:start;flex-direction:column}.hero .primary{width:100%}.shell{padding:15px 14px 60px}.grid{grid-template-columns:1fr 1fr;gap:10px}.doc-cover{height:120px}.doc-body{padding:11px}.doc h3{font-size:14px}.doc .subtitle{font-size:11px}.doc-foot{margin-top:10px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:18px}.top-actions .ghost{font-size:0;padding:9px;width:40px}.top-actions .ghost:first-letter{font-size:18px}}
</style>
</head>
<body><div id="app"></div>
<script>
const KEY='field-notes-documents-v1',CONFIG='field-notes-github-v1';
const CATS={card:{label:'Business cards',icon:'✦'},manual:{label:'Manuals',icon:'▤'},receipt:{label:'Receipts',icon:'⌁'},contract:{label:'Contracts',icon:'§'},other:{label:'Other',icon:'◇'}};
const DEFAULT={owner:'',repo:'',path:'field-notes.json',branch:'main'};
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};
let docs=read(KEY,[]), config={...DEFAULT,...read(CONFIG,{})}, token='';
const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const id=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const save=()=>localStorage.setItem(KEY,JSON.stringify(docs));
const app=document.querySelector('#app');let active='all',query='';
function render(){const filtered=docs.filter(d=>(active==='all'||d.category===active)&&(`${d.title} ${d.subtitle} ${d.tags} ${d.person} ${d.company}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.createdAt-a.createdAt);app.innerHTML=`
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><h1>Field Notes</h1><small>your pocket archive</small></div></div><div class="top-actions"><button class="ghost" onclick="openSync()">☁ Sync</button><button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">◐</button></div></header>
<main class="shell"><section class="hero"><div><h2>Everything worth<br>remembering.</h2><p>Scan a card, save a manual, find the detail later. A tidy visual archive for the things your business touches.</p></div><button class="primary" onclick="openEditor()">＋ Capture document</button></section>
<div class="stats"><div class="stat"><b>${docs.length}</b><span>total records</span></div><div class="stat"><b>${docs.filter(d=>d.category==='card').length}</b><span>people & contacts</span></div><div class="stat"><b>${docs.filter(d=>d.image).length}</b><span>visual scans</span></div></div>
<div class="toolbar"><div class="search"><span>⌕</span><input aria-label="Search documents" placeholder="Search names, companies, tags..." value="${esc(query)}" oninput="query=this.value;render()"></div><div class="filters"><button class="filter ${active==='all'?'active':''}" onclick="active='all';render()">All</button>${Object.entries(CATS).map(([key,c])=>`<button class="filter ${active===key?'active':''}" onclick="active='${key}';render()">${c.icon} ${c.label}</button>`).join('')}</div></div>
<section class="grid">${filtered.length?filtered.map(card).join(''):`<div class="empty"><strong>Your archive is still quiet.</strong><span>Capture your first document and it will appear here.</span><br><button class="primary" onclick="openEditor()">＋ Add a document</button></div>`}</section></main>`}
function card(d){const c=CATS[d.category]||CATS.other;return `<article class="doc"><div class="doc-cover">${d.image?`<img src="${d.image}" alt="${esc(d.title)} scan">`:`<span class="kind">${c.icon}</span>`}<span class="badge">${c.label}</span></div><div class="doc-body"><h3>${esc(d.title)}</h3><div class="subtitle">${esc(d.subtitle||d.company||d.person||'No short description')}</div><div class="tags">${(d.tags||[]).slice(0,3).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><div class="doc-foot"><span>${new Date(d.createdAt).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</span><button onclick="openDetail('${d.id}')">Open record →</button></div></div></article>`}
function openEditor(existing=null){const d=existing||{category:'card',title:'',subtitle:'',person:'',company:'',phone:'',email:'',website:'',tags:[],notes:'',image:''};app.insertAdjacentHTML('beforeend',`<div class="modal-wrap" id="modal"><div class="modal"><div class="modal-head"><div><h2>${existing?'Edit record':'New document'}</h2><div class="hint">Add the details you will want to search later.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="capture"><label for="camera">⌾ Tap to take a photo or choose an image</label><small>On mobile this opens the camera. Images stay local until you sync.</small><input id="camera" type="file" accept="image/*" capture="environment" onchange="readImage(event)">${d.image?`<img class="preview" id="preview" src="${d.image}" alt="Preview">`:'<img class="preview hidden" id="preview" alt="Preview">'}</div><div class="form-grid"><div class="field"><label>Type</label><select id="category">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${d.category===k?'selected':''}>${c.label}</option>`).join('')}</select></div><div class="field"><label>Title *</label><input id="title" value="${esc(d.title)}" placeholder="e.g. Maya Chen"></div><div class="field"><label>Short description</label><input id="subtitle" value="${esc(d.subtitle)}" placeholder="What is this? Where did it come from?"></div><div class="field"><label>Person / contact</label><input id="person" value="${esc(d.person)}" placeholder="Name"></div><div class="field"><label>Company</label><input id="company" value="${esc(d.company)}" placeholder="Organisation"></div><div class="field"><label>Phone</label><input id="phone" value="${esc(d.phone)}" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" value="${esc(d.email)}" type="email"></div><div class="field"><label>Website</label><input id="website" value="${esc(d.website)}" inputmode="url"></div><div class="field full"><label>Tags</label><input id="tags" value="${esc((d.tags||[]).join(', '))}" placeholder="supplier, electrician, warranty"></div><div class="field full"><label>Notes</label><textarea id="notes" placeholder="Useful context, expiry dates, where this belongs...">${esc(d.notes)}</textarea></div></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveDoc('${existing?.id||''}')">${existing?'Save changes':'Save record'}</button></div></div></div>`)}
function readImage(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const image=document.querySelector('#preview');image.src=reader.result;image.classList.remove('hidden');image.dataset.value=reader.result};reader.readAsDataURL(file)}
function value(id){return document.querySelector('#'+id)?.value.trim()||''}
function saveDoc(existingId){const title=value('title');if(!title){alert('Give this record a title first.');return}const old=docs.find(d=>d.id===existingId),preview=document.querySelector('#preview');const record={id:existingId||id(),createdAt:old?.createdAt||Date.now(),category:value('category'),title,subtitle:value('subtitle'),person:value('person'),company:value('company'),phone:value('phone'),email:value('email'),website:value('website'),tags:value('tags').split(',').map(t=>t.trim()).filter(Boolean),notes:value('notes'),image:preview?.dataset.value||old?.image||''};docs=existingId?docs.map(d=>d.id===existingId?record:d):[record,...docs];save();closeModal();render()}
function openDetail(docId){const d=docs.find(x=>x.id===docId),c=CATS[d.category]||CATS.other;app.insertAdjacentHTML('beforeend',`<div class="modal-wrap" id="modal"><div class="modal"><div class="modal-head"><div><h2>${esc(d.title)}</h2><div class="hint">${c.icon} ${c.label}</div></div><button class="close" onclick="closeModal()">×</button></div>${d.image?`<img class="detail-image" src="${d.image}" alt="${esc(d.title)} scan">`:''}<div class="detail-meta">${[['Person',d.person],['Company',d.company],['Phone',d.phone],['Email',d.email],['Website',d.website],['Added',new Date(d.createdAt).toLocaleDateString('en-AU')]].filter(x=>x[1]).map(x=>`<div><small>${x[0]}</small>${esc(x[1])}</div>`).join('')}</div>${d.tags?.length?`<div class="tags">${d.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}${d.notes?`<div class="note">${esc(d.notes)}</div>`:''}<div class="modal-actions"><button class="ghost danger" onclick="removeDoc('${d.id}')">Delete</button><button class="primary" onclick="closeModal();openEditor(docs.find(x=>x.id==='${d.id}'))">Edit record</button></div></div></div>`)}
function removeDoc(docId){if(confirm('Delete this record?')){docs=docs.filter(d=>d.id!==docId);save();closeModal();render()}}
function closeModal(){document.querySelector('#modal')?.remove()}
function openSync(){app.insertAdjacentHTML('beforeend',`<div class="modal-wrap" id="modal"><div class="modal"><div class="modal-head"><div><h2>Private GitHub sync</h2><div class="hint">Your token is used for this session only.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>GitHub owner / username</label><input id="gh-owner" value="${esc(config.owner)}" placeholder="your-name"></div><div class="field" style="margin-top:12px"><label>Private repository</label><input id="gh-repo" value="${esc(config.repo)}" placeholder="field-notes-data"></div><div class="field" style="margin-top:12px"><label>JSON file path</label><input id="gh-path" value="${esc(config.path)}"></div><div class="field" style="margin-top:12px"><label>Fine-grained token</label><input id="gh-token" type="password" value="${esc(token)}" placeholder="github_pat_..."><div class="hint">Contents: Read and write for this repository.</div></div><div class="sync-status" id="sync-status">Local archive is ready. ${docs.length} records.</div><div class="modal-actions"><button class="ghost" onclick="pullGitHub()">↓ Pull latest</button><button class="primary" onclick="pushGitHub()">↑ Save to GitHub</button></div></div></div>`)}
function syncSettings(){config={owner:value('gh-owner'),repo:value('gh-repo'),path:value('gh-path')||DEFAULT.path,branch:'main'};token=value('gh-token');localStorage.setItem(CONFIG,JSON.stringify(config));return config}
function apiUrl(){return `https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${config.path.split('/').map(encodeURIComponent).join('/')}`}
function headers(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
const b64encode=s=>{const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)};const b64decode=s=>{const bin=atob(s.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))};
async function pullGitHub(){syncSettings();const status=document.querySelector('#sync-status');if(!config.owner||!config.repo||!token){status.textContent='Enter your GitHub owner, repository and token first.';return}status.textContent='Pulling latest archive...';try{const r=await fetch(apiUrl(),{headers:headers(),cache:'no-store'});if(!r.ok)throw new Error(r.status===404?'File not found in this repository.':`${r.status} ${r.statusText}`);const remote=JSON.parse(b64decode((await r.json()).content));if(!Array.isArray(remote.documents))throw new Error('The file does not contain a Field Notes archive.');docs=remote.documents;save();closeModal();render()}catch(error){status.textContent='Pull failed: '+error.message}}
async function pushGitHub(){syncSettings();const status=document.querySelector('#sync-status');if(!config.owner||!config.repo||!token){status.textContent='Enter your GitHub owner, repository and token first.';return}status.textContent='Saving archive and images...';try{let sha=null;const existing=await fetch(apiUrl(),{headers:headers(),cache:'no-store'});if(existing.ok)sha=(await existing.json()).sha;else if(existing.status!==404)throw new Error(`${existing.status} ${existing.statusText}`);const body={message:'Update Field Notes archive',content:b64encode(JSON.stringify({version:1,updatedAt:new Date().toISOString(),documents:docs},null,2)),branch:'main'};if(sha)body.sha=sha;const r=await fetch(apiUrl(),{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);status.textContent='Archive saved to the private GitHub repository.'}catch(error){status.textContent='Save failed: '+error.message}}
function toggleTheme(){document.body.classList.toggle('night');if(document.body.classList.contains('night')){document.documentElement.style.setProperty('--paper','#10292b');document.documentElement.style.setProperty('--card','#173b3f');document.documentElement.style.setProperty('--ink','#eff8f2');document.documentElement.style.setProperty('--line','#315255');document.documentElement.style.setProperty('--muted','#a5bfbc')}else location.reload()}
render();
</script></body></html>
